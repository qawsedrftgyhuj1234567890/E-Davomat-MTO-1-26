<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MTO 1-26 elektron davomati</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0b1020">
<style>
:root{--glass:rgba(255,255,255,.12);--edge:rgba(255,255,255,.28);--txt:#f5f7ff;--mut:rgba(245,247,255,.65);--ok:#34d399;--bad:#f87171;--blue:#60a5fa}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
html{background:#0b1020}
body{min-height:100vh;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));display:flex;justify-content:center;color:var(--txt);
 background:radial-gradient(60% 40% at 15% 10%,#3b82f6 0,transparent 60%),radial-gradient(50% 40% at 90% 30%,#a855f7 0,transparent 60%),radial-gradient(60% 50% at 30% 95%,#06b6d4 0,transparent 60%),#0b1020;background-attachment:fixed}
.app{width:100%;max-width:480px;padding:20px;border-radius:28px;background:var(--glass);border:1px solid var(--edge);
 -webkit-backdrop-filter:blur(28px) saturate(180%);backdrop-filter:blur(28px) saturate(180%);box-shadow:0 20px 50px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.35);align-self:flex-start}
h1{font-size:21px;text-align:center;font-weight:700;margin-bottom:18px}
.sub{font-size:13px;text-align:center;color:var(--mut);margin:4px 0 18px}
.g{margin-bottom:16px}
label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--mut)}
select{width:100%;padding:14px;border-radius:14px;font-size:16px;color:var(--txt);outline:none;appearance:none;-webkit-appearance:none;
 background:rgba(255,255,255,.1);border:1px solid var(--edge)}
select option{color:#111}
button,.btn{display:block;width:100%;padding:14px;border:1px solid var(--edge);border-radius:16px;font-size:16px;font-weight:600;color:var(--txt);text-align:center;text-decoration:none;cursor:pointer;
 background:rgba(255,255,255,.14);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);transition:transform .15s,background .2s}
button:active,.btn:active{transform:scale(.97)}
button:disabled{opacity:.45;cursor:not-allowed}
.blue{background:rgba(59,130,246,.45)}.green{background:rgba(16,185,129,.5)}.violet{background:rgba(139,92,246,.45)}.call{background:rgba(245,158,11,.45)}
.stack{display:grid;gap:10px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:6px;border-radius:20px;background:rgba(0,0,0,.2);border:1px solid var(--edge)}
.seg button{margin:0;padding:14px 8px;border-radius:14px;border:1px solid transparent;background:transparent;opacity:.45;pointer-events:none}
.seg button.on{opacity:1;background:rgba(255,255,255,.22);border-color:var(--edge);box-shadow:0 4px 14px rgba(0,0,0,.25)}
.seg button.on.in{background:rgba(16,185,129,.55)}.seg button.on.out{background:rgba(239,68,68,.55)}
.photo{position:relative;height:210px;border-radius:18px;overflow:hidden;display:flex;align-items:center;justify-content:center;cursor:pointer;background:rgba(0,0,0,.2);border:1.5px dashed var(--edge)}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
.photo span{color:var(--mut);font-weight:600;font-size:14px;padding:10px;text-align:center}
.badge{font-size:12.5px;padding:9px;border-radius:12px;background:rgba(255,255,255,.1);text-align:center;margin-top:8px;font-weight:600}
.badge.ok{background:rgba(16,185,129,.35)}.badge.bad{background:rgba(239,68,68,.35)}
#cam{position:fixed;inset:0;z-index:10;display:none;flex-direction:column;background:#000}
#cam video{flex:1;width:100%;min-height:0;object-fit:cover}
#cam .bar{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px 14px max(14px,env(safe-area-inset-bottom))}
.mirror{transform:scaleX(-1)}
</style>
</head>
<body>
<div class="app">
  <div class="stack" style="margin-bottom:14px">
    <button type="button" id="btn-install" class="violet" onclick="installApp()">Telefon ekraniga o'rnatish</button>
  </div>
  <h1>MTO 1-26 elektron davomati</h1>

  <div class="g">
    <label>Talaba F.I.Sh.</label>
    <select id="student-name">
      <option value="">Talabani tanlang...</option>
      <option value="Abduqodirov Salmon">Abduqodirov S.</option>
      <option value="Abdurahmonov Behruzjon">Abdurahmonov B.</option>
      <option value="Abdusamatov Saidnurdixon">Abdusamatov S.</option>
      <option value="Ahmadiyorov Nurbek">Ahmadiyorov N.</option>
      <option value="Ahmadqulov Javohir">Ahmadqulov J.</option>
      <option value="Akramov Nodirbek">Akramov N.</option>
      <option value="Joniqulov Doniyor">Joniqulov D.</option>
      <option value="Kamoliddinov Amirxon">Kamoliddinov A.</option>
      <option value="Kamolov Muhammadjon">Kamolov M.</option>
      <option value="Meliboyev Samandar">Meliboyev S.</option>
      <option value="Murodqulov Jahongir">Murodqulov J.</option>
      <option value="Mustafoqulov Alisher">Mustafoqulov A.</option>
      <option value="Norbekov Shahriyor">Norbekov Sh.</option>
      <option value="Norbo‘tayev Qosimjon">Norbo‘tayev Q.</option>
      <option value="Qurbonboyev Noryigit">Qurbonboyev N.</option>
      <option value="Rayimjonov Umidjon">Rayimjonov U.</option>
      <option value="Safarboyev Behruz">Safarboyev B.</option>
      <option value="Safarboyev Boburjon">Safarboyev B.</option>
      <option value="Shermatov Anvar">Shermatov A.</option>
      <option value="Sulaymonov Shoxrux">Sulaymonov Sh.</option>
      <option value="Sultonov Ibrohim">Sultonov I.</option>
      <option value="Tilovbekov Sunnatullo">Tilovbekov S.</option>
      <option value="Tohirov Salohiddin">Tohirov S.</option>
      <option value="Tursunmurodov Shohjahon">Tursunmurodov Sh.</option>
      <option value="Umurqulov Ergashali">Umurqulov E.</option>
      <option value="Xamroqulov Ozodbek">Xamroqulov O.</option>
      <option value="Xolbo‘tayev Eldor">Xolbo‘tayev E.</option>
      <option value="Xudoyberdiyev Humoyun">Xudoyberdiyev H.</option>
      <option value="Xudoyberdiyev Sunnatbek">Xudoyberdiyev S.</option>
    </select>
  </div>

  <div class="g">
    <label>Holat (avtomatik aniqlanadi)</label>
    <div class="seg">
      <button type="button" id="b-in" class="in">Keldi</button>
      <button type="button" id="b-out" class="out">Ketdi</button>
    </div>
    <div class="badge" id="act-status">Talabani tanlang</div>
  </div>

  <div class="g">
    <label>Face Control (old kamera)</label>
    <div class="photo" onclick="openCamera()">
      <span id="ph">Kamerani ochish uchun bosing</span>
      <img id="preview" alt="">
    </div>
    <div class="badge" id="face-status">Rasm yuklanmagan</div>
    <input type="file" accept="image/*" capture="user" id="camera-file" style="display:none" onchange="handleFile(this)">
  </div>

  <div class="g">
    <label>GPS (Texnikum hududi)</label>
    <button type="button" class="blue" onclick="verifyGPS()">GPS manzilni tekshirish</button>
    <div class="badge" id="geo-status">Tekshirilmagan</div>
  </div>

  <div class="stack">
    <button type="button" class="green" id="btn-submit" onclick="submitData()" disabled>Tasdiqlash va yuborish</button>
    <a class="btn call" href="tel:+998904021122">O'qishdan javob olish</a>
  </div>
</div>

<div id="cam">
  <video id="video" autoplay playsinline muted></video>
  <div class="bar">
    <button type="button" onclick="closeCamera()">Bekor qilish</button>
    <button type="button" class="green" onclick="snap()">Rasmga olish</button>
  </div>
</div>

<script>
/* Cloudflare Worker manzilini shu yerga yozing */
const API = "https://e-mto.otdelkadrov-1khm.workers.dev";
const TARGET = {lat: 40.283016, lon: 69.033260}, RADIUS = 200, ACC_MAX = 60; // metr

let deferredPrompt, faceOk = false, geoOk = false, coords = "", photoBlob = null, nextAct = null, stream = null, mirrored = false;
const $ = id => document.getElementById(id);

/* ---- O'rnatish ---- */
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
if (matchMedia('(display-mode: standalone)').matches || navigator.standalone) $('btn-install').style.display = 'none';
addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; });
addEventListener('appinstalled', () => { $('btn-install').style.display = 'none'; });
function installApp() {
  if (deferredPrompt) { deferredPrompt.prompt(); deferredPrompt = null; }
  else alert("O'rnatish uchun brauzer menyusini (⋮) oching va «Ekranga qo'shish» ni tanlang.");
}

/* ---- Keldi / Ketdi avtomatik ---- */
async function loadStatus() {
  const name = $('student-name').value;
  nextAct = null;
  $('b-in').classList.remove('on'); $('b-out').classList.remove('on');
  if (!name) { $('act-status').textContent = 'Talabani tanlang'; $('act-status').className = 'badge'; return refresh(); }
  $('act-status').textContent = 'Tekshirilmoqda...';
  try {
    const r = await fetch(`${API}/status?name=${encodeURIComponent(name)}`);
    const d = await r.json();
    nextAct = d.next;
    const s = $('act-status');
    if (d.next === 'keldi') { $('b-in').classList.add('on'); s.textContent = 'Bugun hali kelmagan: KELDI yoziladi'; s.className = 'badge ok'; }
    else if (d.next === 'ketdi') { $('b-out').classList.add('on'); s.textContent = `Kelgan vaqt ${d.in}: KETDI yoziladi`; s.className = 'badge bad'; }
    else { s.textContent = `Bugun yakunlangan (${d.in} - ${d.out})`; s.className = 'badge'; }
  } catch (e) {
    $('act-status').textContent = "Server bilan aloqa yo'q"; $('act-status').className = 'badge bad';
  }
  refresh();
}
$('student-name').addEventListener('change', loadStatus);

/* ---- Old (front) kamera, bo'lmasa orqa kamera ---- */
async function openCamera() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return $('camera-file').click();
  const tries = [{video: {facingMode: {exact: 'user'}}}, {video: {facingMode: 'user'}}, {video: {facingMode: 'environment'}}, {video: true}];
  for (const c of tries) {
    try {
      stream = await navigator.mediaDevices.getUserMedia(c);
      const st = stream.getVideoTracks()[0].getSettings();
      mirrored = st.facingMode ? st.facingMode === 'user' : c === tries[0].video || c.video.facingMode === 'user';
      $('video').srcObject = stream;
      $('video').classList.toggle('mirror', mirrored);
      $('cam').style.display = 'flex';
      return;
    } catch (e) {}
  }
  $('camera-file').click();
}
function closeCamera() {
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = null; $('cam').style.display = 'none';
}
function snap() {
  const v = $('video');
  drawToBlob(v, v.videoWidth, v.videoHeight, mirrored);
  closeCamera();
}
function handleFile(input) {
  const f = input.files && input.files[0]; if (!f) return;
  const img = new Image();
  img.onload = () => drawToBlob(img, img.width, img.height, false);
  img.src = URL.createObjectURL(f);
}
function drawToBlob(src, w, h, flip) {
  const M = 800, k = Math.min(1, M / Math.max(w, h));
  const c = document.createElement('canvas'); c.width = w * k; c.height = h * k;
  const x = c.getContext('2d');
  if (flip) { x.translate(c.width, 0); x.scale(-1, 1); }
  x.drawImage(src, 0, 0, c.width, c.height);
  c.toBlob(b => {
    photoBlob = b; faceOk = true;
    $('preview').src = c.toDataURL('image/jpeg', .6); $('preview').style.display = 'block'; $('ph').style.display = 'none';
    $('face-status').textContent = 'Rasm olindi'; $('face-status').className = 'badge ok';
    refresh();
  }, 'image/jpeg', .6);
}

/* ---- GPS (aniq joy tekshiruvi) ---- */
function dist(a, b, c, d) {
  const R = 6371e3, r = Math.PI / 180, p1 = a * r, p2 = c * r, dp = (c - a) * r, dl = (d - b) * r;
  const h = Math.sin(dp / 2) ** 2 + Math.cos(p1) * Math.cos(p2) * Math.sin(dl / 2) ** 2;
  return 2 * R * Math.atan2(Math.sqrt(h), Math.sqrt(1 - h));
}
let lastPos = null;
function getPos() {
  return new Promise((ok, no) => {
    if (!navigator.geolocation) return no(new Error('GPS yoq'));
    navigator.geolocation.getCurrentPosition(ok, no, {enableHighAccuracy: true, timeout: 20000, maximumAge: 0});
  });
}
async function verifyGPS() {
  const s = $('geo-status'); s.className = 'badge'; s.textContent = 'GPS tekshirilmoqda...';
  try {
    const p = await getPos();
    const d = dist(p.coords.latitude, p.coords.longitude, TARGET.lat, TARGET.lon), acc = p.coords.accuracy;
    lastPos = p; coords = `${p.coords.latitude},${p.coords.longitude}`;
    geoOk = d <= RADIUS && acc <= ACC_MAX;
    s.textContent = acc > ACC_MAX ? `GPS aniqligi past (±${Math.round(acc)} m). Ochiq joyga chiqib, qayta tekshiring`
      : geoOk ? `Belgilangan joydasiz (${Math.round(d)} m, ±${Math.round(acc)} m)` : `Belgilangan joydan tashqaridasiz (${Math.round(d)} m)`;
    s.className = 'badge ' + (geoOk ? 'ok' : 'bad');
  } catch (e) {
    geoOk = false; s.textContent = "GPS xatosi yoki ruxsat yo'q"; s.className = 'badge bad';
  }
  refresh();
}
addEventListener('load', verifyGPS); // sahifa ochilganda o'zi tekshiradi

/* ---- Yuborish ---- */
function refresh() {
  const b = $('btn-submit');
  b.disabled = !($('student-name').value && faceOk && geoOk && (nextAct === 'keldi' || nextAct === 'ketdi'));
  b.textContent = nextAct === 'keldi' ? 'Keldi: tasdiqlash va yuborish' : nextAct === 'ketdi' ? 'Ketdi: tasdiqlash va yuborish' : 'Tasdiqlash va yuborish';
}
async function submitData() {
  const b = $('btn-submit'); b.disabled = true; b.textContent = 'Joylashuv tekshirilmoqda...';
  await verifyGPS(); // yuborish oldidan yangi GPS
  b.disabled = true;
  if (!geoOk) { alert('Siz belgilangan joyda emassiz. Yuborilmadi.'); refresh(); return; }
  b.textContent = 'Yuborilmoqda...';
  const fd = new FormData();
  fd.append('name', $('student-name').value);
  fd.append('coords', coords);
  fd.append('acc', lastPos.coords.accuracy);
  fd.append('ts', lastPos.timestamp);
  fd.append('photo', photoBlob, 'face.jpg');
  try {
    const r = await fetch(`${API}/attendance`, {method: 'POST', body: fd});
    const d = await r.json();
    if (!d.ok) throw new Error(d.error || 'Xatolik');
    alert(d.action === 'keldi' ? 'KELDI qayd etildi.' : 'KETDI qayd etildi.');
    location.reload();
  } catch (e) {
    alert('Yuborishda xatolik: ' + e.message);
    refresh();
  }
}
</script>
</body>
</html>
