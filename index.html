<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MTO 1-26 Davomati</title>
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.25);
            --glass-border: rgba(255, 255, 255, 0.4);
            --glass-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
            --text-primary: #1c1c1e;
            --text-secondary: #3a3a3c;
            --accent-blue: #007aff;
            --accent-green: #34c759;
            --accent-red: #ff3b30;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 30%, #fbc2eb 70%, #a6c1ee 100%);
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px;
            color: var(--text-primary);
        }

        .container {
            width: 100%;
            max-width: 450px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* iOS Glassmorphism Card Style */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 24px;
            box-shadow: var(--glass-shadow);
            transition: all 0.3s ease;
        }

        .header {
            text-align: center;
            padding: 30px 20px;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        .header p {
            font-size: 14px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .section-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Form Elements */
        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-secondary);
        }

        select, input {
            width: 100%;
            padding: 14px 16px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(10px);
            font-size: 16px;
            color: var(--text-primary);
            outline: none;
            appearance: none;
            -webkit-appearance: none;
            transition: all 0.2s;
        }

        select:focus, input:focus {
            background: rgba(255, 255, 255, 0.6);
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.2);
        }

        /* Status Badges (Keldi / Ketdi) */
        .status-container {
            display: flex;
            gap: 12px;
            margin-top: 10px;
        }

        .status-badge {
            flex: 1;
            padding: 12px;
            border-radius: 14px;
            text-align: center;
            font-weight: 600;
            font-size: 15px;
            background: rgba(255, 255, 255, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: #8e8e93;
            transition: all 0.3s ease;
        }

        .status-badge.active-keldi {
            background: rgba(52, 199, 89, 0.25);
            border-color: rgba(52, 199, 89, 0.5);
            color: #248a3d;
            box-shadow: 0 4px 12px rgba(52, 199, 89, 0.2);
        }

        .status-badge.active-ketdi {
            background: rgba(255, 59, 48, 0.2);
            border-color: rgba(255, 59, 48, 0.4);
            color: #d70015;
            box-shadow: 0 4px 12px rgba(255, 59, 48, 0.2);
        }

        /* Camera Section */
        .camera-area {
            position: relative;
            width: 100%;
            height: 220px;
            border-radius: 18px;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.1);
            border: 1px dashed rgba(255, 255, 255, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
        }

        .camera-area video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .camera-placeholder {
            text-align: center;
            color: var(--text-secondary);
        }

        .btn {
            width: 100%;
            padding: 16px;
            border-radius: 16px;
            border: none;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
        }

        .btn-camera {
            background: rgba(255, 255, 255, 0.5);
            color: var(--accent-blue);
            border: 1px solid rgba(255, 255, 255, 0.6);
            margin-bottom: 12px;
        }

        .btn-camera:active {
            transform: scale(0.98);
            background: rgba(255, 255, 255, 0.7);
        }

        .btn-call {
            background: linear-gradient(135deg, #34c759, #30b350);
            color: white;
            box-shadow: 0 6px 16px rgba(52, 199, 89, 0.3);
            margin-bottom: 12px;
        }

        .btn-call:active {
            transform: scale(0.98);
        }

        .btn-submit {
            background: linear-gradient(135deg, #007aff, #005ecb);
            color: white;
            box-shadow: 0 6px 16px rgba(0, 122, 255, 0.3);
        }

        .btn-submit:active {
            transform: scale(0.98);
        }

        /* GPS Section */
        .gps-status {
            padding: 14px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.5);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            font-weight: 500;
        }

        .gps-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ff3b30;
            margin-right: 8px;
            display: inline-block;
        }

        .gps-dot.active {
            background: #34c759;
            box-shadow: 0 0 8px #34c759;
        }

        .time-stamp {
            font-size: 12px;
            color: var(--text-secondary);
            text-align: center;
            margin-top: 8px;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Header -->
    <div class="glass-card header">
        <h1>📱 MTO 1-26 Davomati</h1>
        <p>1-son Texnikum | Telefon ekraniga o'rnatish</p>
    </div>

    <!-- Student & Para Selection -->
    <div class="glass-card">
        <div class="section-title">👤 Talaba ma'lumotlari</div>
        
        <div class="form-group">
            <label>Guruh: MTO 1-26</label>
            <select id="studentSelect">
                <option value="" disabled selected>Talabani tanlang...</option>
                <option>Abduqodirov S.</option>
                <option>Abdurahmonov B.</option>
                <option>Abdusamatov S.</option>
                <option>Ahmadiyorov N.</option>
                <option>Ahmadqulov J.</option>
                <option>Akramov N.</option>
                <option>Joniqulov D.</option>
                <option>Kamoliddinov A.</option>
                <option>Kamolov M.</option>
                <option>Meliboyev S.</option>
                <option>Murodqulov J.</option>
                <option>Mustafoqulov A.</option>
                <option>Norbekov Sh.</option>
                <option>Norbo‘tayev Q.</option>
                <option>Qurbonboyev N.</option>
                <option>Rayimjonov U.</option>
                <option>Safarboyev B.</option>
                <option>Safarboyev B.</option>
                <option>Shermatov A.</option>
                <option>Sulaymonov Sh.</option>
                <option>Sultonov I.</option>
                <option>Tilovbekov S.</option>
                <option>Tohirov S.</option>
                <option>Tursunmurodov Sh.</option>
                <option>Umurqulov E.</option>
                <option>Xamroqulov O.</option>
                <option>Xolbo‘tayev E.</option>
                <option>Xudoyberdiyev H.</option>
                <option>Xudoyberdiyev S.</option>
            </select>
        </div>

        <div class="form-group">
            <label>Dars juftligi (Para)</label>
            <select id="paraSelect">
                <option value="" disabled selected>Parani tanlang...</option>
                <option>1-para</option>
                <option>2-para</option>
                <option>3-para</option>
                <option>4-para</option>
            </select>
        </div>

        <!-- Keldi / Ketdi Auto Status -->
        <div class="form-group">
            <label>Davomat holati (Avtomatik)</label>
            <div class="status-container">
                <div id="statusKeldi" class="status-badge">🟢 Keldi</div>
                <div id="statusKetdi" class="status-badge">🔴 Ketdi</div>
            </div>
            <div id="timeStamp" class="time-stamp">Hali tasdiqlanmadi</div>
        </div>
    </div>

    <!-- Face Control -->
    <div class="glass-card">
        <div class="section-title">📸 Face Control</div>
        <div class="camera-area" id="cameraArea">
            <div class="camera-placeholder" id="cameraPlaceholder">
                <div style="font-size: 40px; margin-bottom: 10px;">📷</div>
                <div>Kamerani ochish uchun tugmani bosing</div>
            </div>
            <video id="videoPreview" autoplay playsinline style="display: none;"></video>
        </div>
        <button class="btn btn-camera" onclick="startCamera()">
            📸 Kamerani ochish (Face ID)
        </button>
    </div>

    <!-- GPS Control -->
    <div class="glass-card">
        <div class="section-title">📍 GPS Geolokatsiya</div>
        <div class="gps-status">
            <span><span class="gps-dot" id="gpsDot"></span> <span id="gpsText">Tekshirilmagan</span></span>
            <button class="btn btn-camera" style="width: auto; padding: 8px 16px; margin: 0; font-size: 14px;" onclick="checkGPS()">Tekshirish</button>
        </div>
    </div>

    <!-- Call to Teacher -->
    <div class="glass-card">
        <a href="tel:+998904021122" class="btn btn-call">
            📞 O'qituvchidan javob olish
        </a>
        <button class="btn btn-submit" onclick="submitAttendance()">
            ✅ Tasdiqlash va Yuborish
        </button>
    </div>
</div>

<script>
    let isFaceVerified = false;
    let isGpsVerified = false;

    // 1. Kamera ochish (Old kamera, ishlamasa orqa kamera)
    async function startCamera() {
        const video = document.getElementById('videoPreview');
        const placeholder = document.getElementById('cameraPlaceholder');
        
        try {
            // Avval old (front) kamerani ochishga harakat qilamiz
            const stream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: 'user' } 
            });
            video.srcObject = stream;
            video.style.display = 'block';
            placeholder.style.display = 'none';
            isFaceVerified = true;
            updateStatus('keldi');
        } catch (err) {
            console.warn("Old kamera topilmadi, orqa kameraga o'tilmoqda...", err);
            try {
                // Front ishlamasa, asosiy (orqa) kamerani ochamiz
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'environment' } 
                });
                video.srcObject = stream;
                video.style.display = 'block';
                placeholder.style.display = 'none';
                isFaceVerified = true;
                updateStatus('keldi');
            } catch (err2) {
                alert("Kameraga ruxsat berilmadi yoki qurilmada kamera mavjud emas.");
            }
        }
    }

    // 2. GPS Tekshirish
    function checkGPS() {
        const gpsDot = document.getElementById('gpsDot');
        const gpsText = document.getElementById('gpsText');
        
        if (navigator.geolocation) {
            gpsText.innerText = "Tekshirilmoqda...";
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    gpsDot.classList.add('active');
                    gpsText.innerText = "Texnikum hududi (Tasdiqlandi)";
                    isGpsVerified = true;
                    updateStatus('keldi');
                },
                (error) => {
                    gpsText.innerText = "Xatolik: Ruxsat berilmadi";
                }
            );
        } else {
            gpsText.innerText = "Brauzer qo'llab-quvvatlamaydi";
        }
    }

    // 3. Keldi / Ketdi holatini avtomatik yangilash
    function updateStatus(status) {
        const keldiBadge = document.getElementById('statusKeldi');
        const ketdiBadge = document.getElementById('statusKetdi');
        const timeStamp = document.getElementById('timeStamp');
        const now = new Date().toLocaleTimeString('uz-UZ', {hour: '2-digit', minute:'2-digit'});

        if (status === 'keldi') {
            keldiBadge.classList.add('active-keldi');
            ketdiBadge.classList.remove('active-ketdi');
            timeStamp.innerText = `Keldi: ${now} (Face & GPS tasdiqlandi)`;
        } else if (status === 'ketdi') {
            ketdiBadge.classList.add('active-ketdi');
            keldiBadge.classList.remove('active-keldi');
            timeStamp.innerText = `Ketdi: ${now}`;
        }
    }

    // Ketdi holatini qo'lda ishga tushirish uchun (agar talaba ketayotgan bo'lsa)
    document.getElementById('statusKetdi').addEventListener('click', function() {
        if(isFaceVerified && isGpsVerified) {
            updateStatus('ketdi');
        } else {
            alert("Avval Face va GPS orqali 'Keldi' holatini tasdiqlang!");
        }
    });

    // 4. Ma'lumotlarni yuborish
    function submitAttendance() {
        const student = document.getElementById('studentSelect').value;
        const para = document.getElementById('paraSelect').value;

        if (!student || !para) {
            alert("Iltimos, Talaba va Parani tanlang!");
            return;
        }
        if (!isFaceVerified || !isGpsVerified) {
            alert("Iltimos, Kamera va GPS orqali shaxsingizni tasdiqlang!");
            return;
        }

        alert(`✅ Ma'lumotlar muvaffaqiyatli yuborildi!\nTalaba: ${student}\nPara: ${para}`);
        // Bu yerga backend'ga ma'lumot yuborish (fetch/AJAX) kodlari qo'shiladi
    }
</script>

</body>
</html>
